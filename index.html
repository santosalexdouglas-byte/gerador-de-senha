
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerador de Senhas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Gerador de Senhas</h1>

        <label>Senha gerada:</label>
        <input type="text" id="senha" readonly>

        <label>Tamanho da senha:</label>
        <input type="number" id="tamanho" value="12" min="1" max="50">

        <div class="opcoes">

            <label>
                <input type="checkbox" id="maiusculas" checked>
                Letras maiúsculas
            </label>

            <label>
                <input type="checkbox" id="minusculas" checked>
                Letras minúsculas
            </label>

            <label>
                <input type="checkbox" id="numeros" checked>
                Números
            </label>

            <label>
                <input type="checkbox" id="especiais" checked>
                Caracteres especiais
            </label>

        </div>

        <button onclick="gerarSenha()">Gerar Senha</button>

        <button onclick="limparSenha()">Limpar Senha</button>

    </div>

    <script src="script.js"></script>

</body>
</html>
